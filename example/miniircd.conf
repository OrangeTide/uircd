# miniircd.conf -- sample configuration (gitconfig-style).
#
# Load with:  ./miniircd -f miniircd.conf
# Command-line options override anything set here. Lines starting with '#' or
# ';' are comments. Times are in seconds; 0 (or an omitted key) keeps the
# built-in default.

[server]
	name = irc.local
	network = uircd
	# motd = /etc/miniircd/motd.txt

[listen]
	port = 6667
	ipv6 = false

[tls]
	# Set both cert and key to enable TLS.
	# cert = /etc/miniircd/cert.pem
	# key = /etc/miniircd/key.pem
	# Drop a connection that has not finished the TLS handshake in time.
	handshake-timeout = 10

[auth]
	# passwd = /etc/miniircd/users.passwd
	require-login = false
	# Logins are verified off the engine lock and answered at a fixed deadline,
	# so timing does not reveal which account names exist. The deadline (in
	# milliseconds) must exceed the slowest configured scrypt.
	auth-deadline-ms = 120
	# Random spread (milliseconds) added to the deadline.
	auth-jitter-ms = 20
	# scrypt worker threads.
	kdf-threads = 2

[privacy]
	# Hide each client's real IP from other users. When true (the default) the
	# host shown in WHO and message prefixes is a per-run keyed hash
	# (<hex>.cloak); operators still see real IPs and bans match real IPs. Set
	# false to show raw addresses.
	host-cloak = true

[limits]
	# threads = 0 means one worker per online CPU.
	threads = 0
	# Pause accepting this long (milliseconds) when the fd table is full.
	accept-backoff-ms = 100
	max-per-ip = 8
	reg-timeout = 30
	max-clients = 1024
	max-channels = 1024
	ping-interval = 120
	ping-timeout = 60
	flood-lines = 20
	flood-window = 10
